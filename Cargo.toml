[package]
name = "comodoro"
description = "CLI to manage timers"
version = "2.0.0"
authors = ["Clément DOUIN (soywod) <pimalaya.org@posteo.net>"]
rust-version = "1.89"
edition = "2024"
license = "MIT OR Apache-2.0"
categories = ["command-line-utilities", "date-and-time"]
keywords = ["pomodoro", "timer", "jsonrpc", "cli"]
homepage = "https://pimalaya.org"
repository = "https://github.com/pimalaya/comodoro"

[features]
default = ["notify", "vendored"]
notify = ["pimalaya-config/notify"]
vendored = ["pimalaya-config/vendored"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[build-dependencies]
pimalaya-cli = { version = "0.8.0", default-features = false, features = ["build"] }

[dev-dependencies]
pimalaya-config = { version = "0.6", default-features = false, features = ["sample"] }
tempfile = { version = "3", default-features = false }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }

[dependencies]
anyhow = { version = "1", default-features = false, features = ["std"] }
clap = { version = "4.4", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
convert_case = { version = "0.12", default-features = false }
log = { version = "0.4", default-features = false }
pimalaya-cli = { version = "0.8.0", default-features = false, features = ["duration", "mcp", "repl", "signal", "terminal"] }
pimalaya-config = { version = "0.6", default-features = false, features = ["toml", "secret"] }
schemars = { version = "1", default-features = false, features = ["derive"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
uds_windows = { version = "1", default-features = false }
