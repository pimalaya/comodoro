[accounts.example]

# Makes this account the default one when `--account` is omitted.
#
default = true

# Path of the local socket the server binds and the clients connect
# to.
#
# Defaults to comodoro.sock inside $XDG_RUNTIME_DIR, or inside the
# platform temporary directory when that variable is unset. Set it
# when you run several timers at once, giving each account its own
# socket. The table is also spelled "unix-socket", the name Comodoro
# 1.x used.
#
#socket.path = "/run/user/1000/comodoro.sock"

# Makes the local socket the client choice when the command names no
# transport.
#
# The socket is already that choice when neither table claims the
# default, so this only matters against a "tcp.default".
#
#socket.default = true

# Host and port of the TCP endpoint the server binds and the clients
# connect to.
#
# Absent by default, in which case the account opens no port at all.
# The listener is unauthenticated, so whoever reaches the port drives
# the timer: keep it on loopback unless you mean to expose it.
#
#tcp.host = "127.0.0.1"
#tcp.port = 9999

# Makes TCP the client choice when the command names no transport.
#
# Ignored when "socket.default" is set as well, since the socket is
# the transport every account has.
#
#tcp.default = true

# A cycle is a step in the timer lifetime, represented by a name and a
# duration (in seconds).
#
# Example of a Pomodoro cycles:
#
cycles = [
  { name = "Work", duration = 1500 },      # 25 min
  { name = "Rest", duration = 300 },       #  5 min
  { name = "Work", duration = 1500 },      # 25 min
  { name = "Rest", duration = 300 },       #  5 min
  { name = "Work", duration = 1500 },      # 25 min
  { name = "Long rest", duration = 1800 }, # 30 min
]

# Example of a 52/17 cycles:
#
#cycles = [
#  { name = "Work", duration = 3120 }, # 52 min
#  { name = "Rest", duration = 1020 }, # 17 min
#]

# Example of a 112/26 cycles:
#
#cycles = [
#  { name = "Work", duration = 6720 }, # 112 min
#  { name = "Rest", duration = 1560 }, #  26 min
#]

# Forces the timer to stop after the given amount of loops.
#
#cycles-count = 5

# Customize the timer precision.
# Available options: second, minute, hour.
#
precision = "minute"

# A hook runs either a shell command or a system notification.
#
# Hook names follow the format "on-{name}-{event}", where "name" is
# the kebab-case version of the cycle name, and "event" the type of
# event: begin, running, set, pause, resume, end.
#
# The two timer-wide events "on-timer-start" and "on-timer-stop" fire
# when the timer itself starts and stops.
#
# A command given as a string is run through the platform shell, so
# pipes, redirections and globs work:
#
#hooks.on-work-begin.command = "echo 'Work started!' >> /tmp/comodoro.log"

# A command given as an array is executed directly, with no shell
# involved, so no quoting rule applies beyond the kernel exec rules:
#
#hooks.on-work-begin.command = ["notify-send", "Comodoro", "Work started!"]

# A notification is sent to the system notification daemon. It
# requires the `notify` cargo feature, enabled by default.
#
hooks.on-work-begin.notify.summary = "Comodoro"
hooks.on-work-begin.notify.body = "Work started!"
