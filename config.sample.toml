[accounts.example]
default = true				# make this account the default one used
precision = "minute"			# print the remaining minutes
#precision = "second"			# print the remaining minutes and seconds
#precision = "hour"			# print the remaining hours only
#cycles-count = 4			# stop after that many loops, endless when absent

#socket.path = "/run/user/1000/comodoro.sock"	# comodoro.sock in $XDG_RUNTIME_DIR by default
#tcp.host = "127.0.0.1"				# the TCP host, unauthenticated so keep it on loopback
#tcp.port = 9999				# the TCP port
#tcp.default = true				# talk over TCP when a command names no transport

#hooks.on-timer-start.command = "exit 127"		# a shell line, or a program and its arguments
#hooks.on-work-end.notify.summary = "$cycleName ended"	# a notification, $cycleName and $cycleDuration filled

